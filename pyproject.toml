[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoquiz-forge"
version = "0.1.0"
description = "Local question bank preparation tool for MemoQuiz"
requires-python = ">=3.11"

[project.scripts]
memoquiz-forge = "memoquiz_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
